<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1b29"/>
      <stop offset="1" stop-color="#081018"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a94ff"/>
      <stop offset="1" stop-color="#2d6ed8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>
  <rect x="17" y="17" width="478" height="478" rx="103" fill="none" stroke="#1d3d63" stroke-width="2"/>

  <rect x="66" y="82" width="380" height="348" rx="46" fill="#0a1521" stroke="url(#screen)" stroke-width="14"/>

  <path d="M158 190 L238 256 L158 322" fill="none" stroke="url(#screen)" stroke-width="38"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="276" y="303" width="112" height="38" rx="19" fill="#ff8c1a"/>

  <g filter="url(#glow)" opacity="0.9">
    <rect x="112" y="368" width="288" height="7" rx="3.5" fill="#ff8c1a"/>
  </g>

  <circle cx="394" cy="128" r="9" fill="#ff8c1a"/>
</svg>
